# WyrmGPT TOML config example
# Place as config.toml in the repo root.

# Values here are non-secret defaults and normal app settings.
# Secrets live in config.secrets.toml.

# TOML values take precedence; .env remains as fallback during migration.

[core]
system_prompt_file = "./prompts/callie3rd_prompt.txt"
# default_system_prompt = "You are a helpful assistant..."
debug_mode = true
debug_errors = true

[ui]
local_timezone = "America/New_York"
context_preview_limit_min = 20
context_preview_limit_max = 200
min_rag_query_text_len = 5
context_idle_ms = 5000
transcript_idle_ms = 120000
debug_boot = true

[summary]
summary_max_tokens = 800
summary_conversation_prompt_file = "./prompts/_summary_convo_prompt.txt"
summary_artifact_prompt_file = "./prompts/_summary_artifact_prompt.txt"
summary_artifact_reduce_prompt_file = "./prompts/_summary_artifact_reduce_prompt.txt"
# summary_conversation_prompt = """..."""
summary_reduce_threshold_chars = 12000
summary_chunk_target_chars = 7000
summary_chunk_hard_max_chars = 10000
summary_chunk_max_tokens = 350

[context]
max_tokens = 12000
memory_pin_limit = 250
history_limit = 200
preview_limit = 20
# estimate_model = "gpt-5-mini"

[retrieval]
query_include = ["MEMORY", "CHAT_SUMMARY", "FTS", "EMBEDDING"]
query_expand_results = ["CHAT"]
# ["FILE", "MEMORY", "CHAT"]
rag_limit = 10
max_chars = 1500
query_max_full_files = 50
query_max_full_memories = 500
query_max_full_chats = 5
query_expand_min_artifact_hits = 3
query_expand_chat_window_before = 1
query_expand_chat_window_after = 1
query_global_artifacts = false
retrieval_cache_ttl_sec = 180.0
retrieval_cache_max_entries = 64
query_include_project_conversation_transcripts = true
query_include_global_conversation_transcripts = false
query_include_recent_conversation_transcripts = false
recent_conversation_transcript_limit = 20

[query]
max_terms = 14
max_phrase_words = 8
max_phrase_chars = 64
filler_words_file = "./FTS filler+stop words.txt"
# filler_words = "a, an, the, ..."
long_query_chars = 400
max_query_slices = 6
llm_expand_enabled = true
llm_expand_prompt_file = "./prompts/_expand_query_prompt.txt"
llm_expand_min_terms = 4
llm_expand_min_results = 3
llm_expand_max_keywords = 10
# llm_expand_model = "gpt-5-mini"
llm_expand_max_tokens = 800

[import]
prose_chunk_target_chars = 6000
prose_chunk_hard_max_chars = 9000
code_chunk_target_chars = 5200
code_chunk_hard_max_chars = 7800
transcript_chunk_target_chars = 2200
transcript_chunk_hard_max_chars = 3200
trailing_merge_min_chars = 800
ensure_files_limit_per_scope = 10
artifact_sidecar_threshold_bytes = 512000

# TODO should this section be in deployments?
[vector]
backend = "qdrant_local"
collection_name = "wyrmgpt_chunks"
local_path = "./data/qdrant"
server_url = ""
distance_metric = "cosine"
search_limit = 12

[app]
search_chat_history = true

[tools]
enabled = true
catalog_file = "./server/tool_catalog.json"
allow_assistant_tool_blocks = true
max_calls_per_message = 4

[tenant_policy]
default_tenant_id = "default"
public_sharing_enabled = false
persona_resource_owner = "active_user" # persona | active_user | tenant
missing_access_default = "allow_owner" # allow_owner | allow_tenant | deny | single_user_compatible
audit_verbosity = "mutations" # off | mutations | decisions | verbose

[tenant_policy.visibility_defaults]
conversation = "private"
message = "private"
memory = "private"
file = "private"
artifact = "private"
project = "private"

[providers.openai]
type = "openai"
base_url = "https://api.openai.com/v1"
api_key = "" # stored in config.secrets.toml
# Moving to [deployments.chat_default]
model = "gpt-5.4"
# Moving to [deployments.summary_default]
summary_model = "gpt-5-mini"

[providers.lmstudio_local]
type = "lmstudio"
base_url = "http://localhost:1234/v1"
api_key = "lm-studio"

[providers.ollama_local]
type = "ollama"
base_url = "http://localhost:11434/v1"
api_key = "ollama"

[providers.google]
type = "google"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
api_key = "" # stored in config.secrets.toml

[providers.anthropic]
