services:
  wyrmgpt:
    build:
      context: ${WYRMGPT_HOST_REPO:-/opt/openclaw-data/workspace/wyrmgpt}
      dockerfile: Dockerfile
    image: ${WYRMGPT_IMAGE_NAME:-wyrmgpt-web:host}
    container_name: ${WYRMGPT_CONTAINER_NAME:-wyrmgpt-web}
    restart: unless-stopped
    ports:
      - "${WYRMGPT_PORT:-18080}:8000"
    volumes:
      - ${WYRMGPT_CONFIG_ROOT:-/opt/openclaw-data/wyrmgpt/config}/config.toml:/app/config.toml
      - ${WYRMGPT_CONFIG_ROOT:-/opt/openclaw-data/wyrmgpt/config}/config.secrets.toml:/app/config.secrets.toml
      - ${WYRMGPT_PROMPTS_ROOT:-/opt/openclaw-data/wyrmgpt/prompts}:/app/prompts
      - ${WYRMGPT_DATA_ROOT:-/opt/openclaw-data/workspace/wyrmgpt/data}:/app/data
    environment:
      PYTHONUNBUFFERED: "1"
